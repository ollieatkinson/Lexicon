name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: SwiftPM macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Swift version
        run: |
          xcodebuild -version
          swift --version
      - name: Build Lexicon CLI
        run: swift build --product lexicon -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  linux:
    name: SwiftPM Linux
    runs-on: ubuntu-latest
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build Lexicon CLI
        run: swift build --product lexicon -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  android:
    name: SwiftPM Android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on Android
        id: android
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: '6.3'
          swift-build-flags: -Xswiftc -warnings-as-errors
          android-api-level: 28
          free-disk-space: true
