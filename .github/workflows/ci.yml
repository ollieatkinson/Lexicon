name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:

jobs:
  test:
    name: SwiftPM
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Swift version
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
