name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: SwiftPM macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Swift version
        run: |
          xcodebuild -version
          swift --version
      - name: Build Lexicon CLI
        run: swift build --product lexicon -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  linux:
    name: SwiftPM Linux
    runs-on: ubuntu-latest
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build Lexicon CLI
        run: swift build --product lexicon -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
